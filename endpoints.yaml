openapi: 3.0.3
info:
  title: LinguArena API
  version: 2.0.0
  description: 'API RESTful de **LinguArena**, app web y móvil para aprender un idioma avanzando

    en una historia por capítulos. No hay competencia entre usuarios: el estudiante

    progresa con XP, niveles, racha, insignias y desbloqueo de capítulos.

    '
  contact:
    name: Equipo 2
servers:
- url: http://localhost:3000/api/v1
  description: Desarrollo local
security:
- bearerAuth: []
tags:
- name: Cuenta
  description: Registro, inicio de sesión, perfil y notificaciones.
- name: Capitulos
  description: Actividades, pistas, recompensas, insignias, progreso y cierre de capitulos.
- name: Nivelación
  description: Prueba de nivel inicial A1–C2.
- name: Storylines
  description: Catálogo de storylines y sus capítulos.
- name: Contenido
  description: Carga y publicación de contenido (administrador).
- name: Grupos
  description: Grupos de clase, codigos de invitacion, asignaciones y progreso para el docente.
paths:
  /auth/registro:
    post:
      tags:
      - Cuenta
      summary: Registrarse
      description: Crea la cuenta e inicia sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Usuario creado y sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags:
      - Cuenta
      summary: Iniciar sesión
      description: Valida las credenciales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/refresh:
    post:
      tags:
      - Cuenta
      summary: Renovar el token de acceso
      description: Entrega un token de acceso nuevo a partir del token de renovación. (RF-02)
      operationId: renovarToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nuevos tokens emitidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /auth/logout:
    post:
      tags:
      - Cuenta
      summary: Cerrar sesión
      description: Invalida el token de renovación del dispositivo actual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.
  /auth/recuperar-contrasena:
    post:
      tags:
      - Cuenta
      summary: Pedir un enlace para recuperar la contraseña
      description: Envía al correo un enlace con un token de un solo uso y con vencimiento. Siempre
        responde 202, exista o no la cuenta, para no revelar qué correos están registrados.
      operationId: solicitarRecuperacionContrasena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarContrasenaRequest'
      responses:
        '202':
          description: Solicitud recibida.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
  /auth/restablecer-contrasena:
    post:
      tags:
      - Cuenta
      summary: Restablecer la contraseña con el token del correo
      description: Cambia la contraseña y cierra todas las sesiones abiertas del usuario.
      operationId: restablecerContrasena
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '204':
          description: Contraseña restablecida.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          description: El token de recuperación no existe, ya se usó o venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /usuarios/me:
    get:
      tags:
      - Cuenta
      summary: Ver mi perfil
      description: "Devuelve el perfil del usuario autenticado. \n"
      operationId: obtenerMiPerfil
      responses:
        '200':
          description: Perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUsuario'
    patch:
      tags:
      - Cuenta
      summary: Editar mi perfil
      description: Actualiza los campos enviados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUsuario'
  /usuarios/me/contrasena:
    put:
      tags:
      - Cuenta
      summary: Cambiar mi contraseña
      description: Pide la contraseña actual y la reemplaza por la nueva. Cierra las sesiones de los
        demás dispositivos.
      operationId: cambiarContrasena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contraseña actualizada.
        '400':
          description: Datos inválidos o la contraseña actual no coincide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /usuarios/me/preferencias:
    get:
      tags:
      - Cuenta
      summary: Ver mis preferencias de notificación
      description: Devuelve el recordatorio diario y los tipos de notificación desactivados.
      operationId: obtenerMisPreferencias
      responses:
        '200':
          description: Preferencias del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasNotificacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    patch:
      tags:
      - Cuenta
      summary: Editar mis preferencias de notificación
      description: Actualiza solo los campos enviados. El recordatorio diario avisa antes de que el
        estudiante pierda su racha.
      operationId: actualizarMisPreferencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPreferenciasRequest'
      responses:
        '200':
          description: Preferencias actualizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasNotificacion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /notificaciones:
    get:
      tags:
      - Cuenta
      summary: Ver mis notificaciones
      description: Lista las notificaciones del usuario en orden .
      parameters:
      - name: leida
        in: query
        required: false
        description: Filtra por leídas o no leídas. Omitir = todas
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Notificaciones del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaNotificaciones'
  /notificaciones/leer-todas:
    post:
      tags:
      - Cuenta
      summary: Marcar todas mis notificaciones como leídas
      description: Marca como leídas todas las notificaciones no leídas del usuario.
      operationId: marcarTodasLeidas
      responses:
        '204':
          description: Todas las notificaciones quedaron leídas.
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /notificaciones/dispositivos:
    post:
      tags:
      - Cuenta
      summary: Registrar el dispositivo para notificaciones push
      description: La app móvil envía su token de push al iniciar sesión. Si el token ya estaba
        registrado, solo se actualiza.
      operationId: registrarDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarDispositivoRequest'
      responses:
        '204':
          description: Dispositivo registrado.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /notificaciones/{notificacionId}:
    patch:
      tags:
      - Cuenta
      summary: Marcar una notificación como leída o no leída
      description: Solo el dueño de la notificación puede cambiarla.
      parameters:
      - $ref: '#/components/parameters/NotificacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarNotificacionRequest'
      responses:
        '200':
          description: Notificación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /usuarios/me/insignias:
    get:
      tags:
      - Capitulos
      summary: Ver mis insignias
      description: Lista las insignias que obtuvo el usuario, de la más reciente a la más antigua.
      operationId: listarMisInsignias
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Insignias obtenidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLogros'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
  /capitulos/{capituloId}:
    get:
      tags:
      - Capitulos
      summary: Obtener escenas y actividades de un capítulo
      description: Devuelve el capítulo con sus escenas en orden y las actividades. Incluye el progreso
        del estudiante para saber qué escena retomar.
      operationId: obtenerCapitulo
      parameters:
      - $ref: '#/components/parameters/CapituloId'
      responses:
        '200':
          description: Capítulo listo para jugar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapituloJuego'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /capitulos/{capituloId}/inicio:
    post:
      tags:
      - Capitulos
      summary: Empezar o retomar un capítulo
      description: 'Si el capítulo está disponible o completado y se quiere repetir, lo pasa al estado

        `en_curso`. Si ya está `en_curso`, no cambia nada y devuelve el progreso actual.

        '
      operationId: iniciarCapitulo
      parameters:
      - $ref: '#/components/parameters/CapituloId'
      responses:
        '200':
          description: Capítulo retomado en la escena donde se quedó.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresoCapitulo'
        '201':
          description: Capítulo iniciado (o reiniciado para repetirlo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresoCapitulo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /capitulos/{capituloId}/finalizacion:
    post:
      tags:
      - Capitulos
      summary: Da por finalizado el capitulo (puntaje, estrellas, recompensas y desbloquea el siguiente
        capitulo)
      description: Calcula el puntaje y lo compara con el `puntajeMinimo`. Lo da por **Aprobado** o **No
        Aprobado**
      operationId: finalizarCapitulo
      parameters:
      - $ref: '#/components/parameters/CapituloId'
      responses:
        '200':
          description: Capítulo cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoFinalizacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El capítulo no está en curso o faltan actividades por responder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                incompleto:
                  value:
                    codigo: CAPITULO_INCOMPLETO
                    mensaje: Faltan 2 actividades por responder.
                noIniciado:
                  value:
                    codigo: CAPITULO_NO_INICIADO
                    mensaje: Este capítulo no está en curso.
  /actividades/{actividadId}/intentos:
    post:
      tags:
      - Capitulos
      summary: Responder una actividad y recibir corrección y XP
      description: Registra un `IntentoActividad`, lo corrige al instante y devuelve la respuesta correcta
        y la explicación.
      operationId: responderActividad
      parameters:
      - $ref: '#/components/parameters/ActividadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoIntento'
            examples:
              opcionUnica:
                summary: Vocabulario / comprensión / escucha
                value:
                  respuesta: b
              textoLibre:
                summary: Escucha (escribir) / escritura corta
                value:
                  respuesta: I would like a coffee
              emparejar:
                summary: Emparejar u ordenar
                value:
                  respuesta:
                  - apple-manzana
                  - dog-perro
                  - house-casa
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NuevoIntentoPronunciacion'
      responses:
        '201':
          description: Intento registrado y corregido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoIntento'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El capítulo de esta actividad no está `en_curso`; hay que llamar a `/inicio` primero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CAPITULO_NO_INICIADO
                mensaje: Inicia el capítulo antes de responder sus actividades.
        '502':
          description: El Servicio de voz no respondió (solo pronunciación).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: SERVICIO_VOZ_NO_DISPONIBLE
                mensaje: No pudimos calificar tu pronunciación. Intenta de nuevo.
  /actividades/{actividadId}/pista:
    post:
      tags:
      - Capitulos
      summary: Pedir una pista (descuenta monedas)
      description: Descuenta `costoPista` monedas y devuelve la pista.
      operationId: pedirPista
      parameters:
      - $ref: '#/components/parameters/ActividadId'
      responses:
        '200':
          description: Pista entregada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PistaEntregada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Saldo insuficiente o capítulo no iniciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saldo:
                  value:
                    codigo: SALDO_INSUFICIENTE
                    mensaje: No tienes monedas suficientes para esta pista.
                    detalles:
                    - campo: monedas
                      mensaje: Tienes 2 monedas y la pista cuesta 5.
                noIniciado:
                  value:
                    codigo: CAPITULO_NO_INICIADO
                    mensaje: Inicia el capítulo antes de pedir pistas.
  /storylines:
    get:
      tags:
      - Storylines
      summary: Ver el catálogo de storylines
      description: 'Lista las storylines **publicadas** con su nivel y tema (RF-05, RN-09).

        Si el estudiante ya hizo la prueba de nivel, las storylines de su nivel

        aparecen primero y llevan `recomendada: true` (RN-06); las demás siguen

        disponibles, nada se bloquea por nivel.

        '
      operationId: listarStorylines
      parameters:
      - name: nivelMCER
        in: query
        required: false
        description: Filtra por nivel recomendado de la storyline.
        schema:
          $ref: '#/components/schemas/NivelMCER'
      - name: tema
        in: query
        required: false
        description: Filtra por tema (por ejemplo, `Ingeniería`).
        schema:
          type: string
          example: Ingeniería
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Catálogo de storylines publicadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaStorylines'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /storylines/{storylineId}:
    get:
      tags:
      - Storylines
      summary: Ver una storyline
      description: 'Devuelve la storyline con sus personajes y sus capítulos en orden. Cada

        capítulo trae el estado del estudiante (`bloqueado`, `disponible`,

        `en_curso` o `completado`) y sus estrellas (RF-06, RN-01, RN-02).

        Las escenas y actividades no vienen aquí: se obtienen al abrir un

        capítulo. Una storyline sin publicar responde 404 (RN-09).

        '
      operationId: obtenerStoryline
      parameters:
      - $ref: '#/components/parameters/StorylineId'
      responses:
        '200':
          description: Storyline con sus capítulos y el estado del estudiante en cada uno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storyline'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /admin/storylines:
    post:
      tags:
      - Contenido
      summary: Cargar una storyline completa
      description: "Solo el administrador de contenido (RF-30). Crea en una sola petición la\nstoryline\
        \ con sus personajes, capítulos, escenas y actividades. Queda\ncomo borrador (`publicada: false`)\
        \ hasta que se publique con\n`PATCH /admin/storylines/{storylineId}`.\n\n- Los capítulos se numeran\
        \ desde 1 y las escenas se ordenan con `orden`.\n- En las escenas de diálogo, `personaje` es el\
        \ nombre de quien habla y debe\n  existir en la propia storyline.\n- `respuestaCorrecta`, `explicacion`\
        \ y `pista` solo se envían aquí; la API\n  nunca los devuelve al cargar el contenido.\n"
      operationId: crearStoryline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storyline'
            example:
              titulo: Tu primer día como ingeniero
              tema: Ingeniería
              nivelMCER: A2
              descripcion: Conoce a tu equipo, entiende tus primeras tareas y sobrevive a tu primera reunión
                en inglés.
              portadaUrl: https://cdn.linguarena.app/portadas/primer-dia.png
              personajes:
              - nombre: Maya
                descripcion: Tu mentora, ingeniera de software senior.
                avatarUrl: https://cdn.linguarena.app/avatares/maya.png
              - nombre: Leo
                descripcion: Compañero de equipo, siempre con prisa.
              capitulos:
              - numero: 1
                titulo: Welcome to the team
                puntajeMinimo: 60
                escenas:
                - orden: 1
                  tipo: narracion
                  texto: It is your first morning at the office. A woman waves at you from her desk.
                  imagenUrl: https://cdn.linguarena.app/escenas/oficina.png
                - orden: 2
                  tipo: dialogo
                  texto: 'Maya: Hi! I''m Maya. Your first deadline is on Friday.'
                  personaje: Maya
                  audioUrl: https://cdn.linguarena.app/audios/c1e2.mp3
                  actividades:
                  - tipo: vocabulario
                    enunciado: What does 'deadline' mean?
                    opciones:
                    - clave: a
                      texto: fecha límite
                    - clave: b
                      texto: reunión
                    - clave: c
                      texto: vacaciones
                    - clave: d
                      texto: sueldo
                    respuestaCorrecta: a
                    explicacion: '''Deadline'' es la fecha o la hora máxima para entregar algo.'
                    pista: Piensa en la palabra "plazo".
                    costoPista: 5
                    xp: 10
      responses:
        '201':
          description: Storyline creada como borrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storyline'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
  /admin/storylines/{storylineId}:
    patch:
      tags:
      - Contenido
      summary: Editar o publicar una storyline
      description: 'Solo el administrador de contenido (RF-30). Actualiza los datos

        generales enviados y permite publicar o despublicar con `publicada`.

        Para publicar, la storyline debe tener al menos un capítulo y cada

        capítulo al menos una escena; si no, responde 409. Al publicarla

        aparece en el catálogo (RN-09), y su capítulo 1 queda disponible para

        todos los estudiantes (RN-02).

        '
      operationId: actualizarStoryline
      parameters:
      - $ref: '#/components/parameters/StorylineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarStorylineRequest'
            example:
              publicada: true
      responses:
        '200':
          description: Storyline actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storyline'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /pruebas-nivel:
    post:
      tags:
      - Nivelación
      summary: Iniciar la prueba de nivel
      description: 'Crea una prueba de nivel para el estudiante y devuelve sus preguntas, sin

        las respuestas correctas (RF-04). Se hace al registrarse (RN-06). Si el

        estudiante ya tiene una prueba en curso, devuelve esa misma con 200 en

        lugar de crear otra.

        '
      operationId: iniciarPruebaNivel
      responses:
        '201':
          description: Prueba creada, con sus preguntas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruebaNivel'
        '200':
          description: Ya había una prueba en curso; se devuelve la misma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruebaNivel'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /pruebas-nivel/{pruebaId}/respuestas:
    post:
      tags:
      - Nivelación
      summary: Enviar las respuestas y recibir el nivel
      description: 'Califica la prueba y asigna al estudiante un nivel entre A1 y C2 (RF-04).

        El nivel queda guardado en su perfil (`nivelMCER`) y la respuesta incluye

        las storylines recomendadas para ese nivel, sin bloquear las demás

        (RN-06). Las preguntas sin respuesta cuentan como incorrectas. Una prueba

        solo se puede enviar una vez.

        '
      operationId: enviarRespuestasPruebaNivel
      parameters:
      - $ref: '#/components/parameters/PruebaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestasPruebaNivelRequest'
            example:
              respuestas:
              - preguntaId: 6f1d3c0e-2b7a-4c55-9a3e-0d9c1f6b8a11
                respuesta: a
              - preguntaId: 0b8e5a47-91c2-4f0b-8f7d-3a2e6c4d5b22
                respuesta: She works in a hospital.
      responses:
        '200':
          description: Prueba calificada, con el nivel asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruebaNivel'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
  /grupos:
    post:
      tags:
      - Grupos
      summary: Crear un grupo
      description: 'Solo el docente (RF-25). Crea un grupo de clase y genera su `codigoInvitacion`,

        que el docente comparte con sus estudiantes. El grupo pertenece al docente

        que lo crea (RN-07).

        '
      operationId: crearGrupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearGrupoRequest'
            example:
              nombre: Inglés Técnico
              seccion: Sección 1101
      responses:
        '201':
          description: Grupo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    get:
      tags:
      - Grupos
      summary: Listar mis grupos
      description: 'Devuelve los grupos del usuario autenticado (RF-25, RF-26). Si es docente, los

        grupos que creó; si es estudiante, los grupos a los que se unió (RN-07).

        El `codigoInvitacion` solo se incluye para el docente dueño del grupo.

        '
      operationId: listarMisGrupos
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Grupos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaGrupos'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /grupos/unirse:
    post:
      tags:
      - Grupos
      summary: Unirse a un grupo con un código
      description: 'Solo el estudiante (RF-26). Lo agrega al grupo que tiene ese código de invitación.

        Un estudiante puede estar en varios grupos (RN-07).

        '
      operationId: unirseAGrupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnirseGrupoRequest'
            example:
              codigoInvitacion: K7QM2X
      responses:
        '201':
          description: El estudiante quedó unido al grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: Ningún grupo tiene ese código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CODIGO_INVALIDO
                mensaje: El código de invitación no existe.
        '409':
          description: El estudiante ya es miembro del grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: YA_ES_MIEMBRO
                mensaje: Ya perteneces a este grupo.
  /grupos/{grupoId}/asignaciones:
    post:
      tags:
      - Grupos
      summary: Asignar un capítulo a un grupo con fecha límite
      description: 'Solo el docente dueño del grupo (RF-27). El capítulo debe existir y pertenecer a

        una storyline publicada (RN-09); el docente asigna capítulos que ya existen.

        La `fechaLimite` debe ser futura. No se puede asignar dos veces el mismo

        capítulo al mismo grupo.

        '
      operationId: asignarCapitulo
      parameters:
      - $ref: '#/components/parameters/GrupoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAsignacionRequest'
            example:
              capituloId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              fechaLimite: '2026-12-05T23:59:00-06:00'
      responses:
        '201':
          description: Capítulo asignado al grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignacion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ese capítulo ya está asignado a este grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: ASIGNACION_DUPLICADA
                mensaje: Este capítulo ya fue asignado al grupo.
    get:
      tags:
      - Grupos
      summary: Ver las asignaciones de un grupo
      description: 'Lista las asignaciones del grupo, de la fecha límite más próxima a la más lejana

        (RF-27). Pueden verla el docente dueño y los estudiantes del grupo (RN-07,

        RN-08).

        '
      operationId: listarAsignaciones
      parameters:
      - $ref: '#/components/parameters/GrupoId'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Asignaciones del grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaAsignaciones'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /grupos/{grupoId}/progreso:
    get:
      tags:
      - Grupos
      summary: Ver el progreso del grupo
      description: 'Solo el docente dueño del grupo (RF-28, RN-08). Devuelve el avance agregado por

        asignación y el avance de cada estudiante del grupo. La lista de

        `estudiantes` va paginada.

        '
      operationId: obtenerProgresoGrupo
      parameters:
      - $ref: '#/components/parameters/GrupoId'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Progreso del grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresoGrupo'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /grupos/{grupoId}/estudiantes/{estudianteId}/progreso:
    get:
      tags:
      - Grupos
      summary: Ver el progreso de un estudiante del grupo
      description: 'Solo el docente dueño del grupo (RF-28, RN-08). Devuelve el avance del estudiante

        en cada asignación del grupo. Responde 404 si el estudiante no pertenece al

        grupo.

        '
      operationId: obtenerProgresoEstudiante
      parameters:
      - $ref: '#/components/parameters/GrupoId'
      - $ref: '#/components/parameters/EstudianteId'
      responses:
        '200':
          description: Progreso del estudiante dentro del grupo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresoEstudianteGrupo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limite:
      name: limite
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    NotificacionId:
      name: notificacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapituloId:
      name: capituloId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActividadId:
      name: actividadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StorylineId:
      name: storylineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PruebaId:
      name: pruebaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrupoId:
      name: grupoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EstudianteId:
      name: estudianteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: Recurso no encontrado.
    SolicitudInvalida:
      description: El cuerpo o los parámetros no tienen el formato esperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: VALIDACION
            mensaje: Uno o más campos son inválidos.
            detalles:
            - campo: respuesta
              mensaje: Es obligatorio.
    NoAutenticado:
      description: Falta el token, es inválido o expiró.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Token ausente o expirado.
    RolNoPermitido:
      description: El rol del usuario no puede usar este recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ROL_NO_PERMITIDO
            mensaje: Solo los estudiantes pueden usar este recurso.
    CapituloBloqueado:
      description: El capítulo sigue bloqueado (RN-01) o el rol no es estudiante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bloqueado:
              value:
                codigo: CAPITULO_BLOQUEADO
                mensaje: Aprueba el capítulo anterior para desbloquear este.
            rol:
              value:
                codigo: ROL_NO_PERMITIDO
                mensaje: Solo los estudiantes pueden jugar capítulos.
    Prohibido:
      description: El usuario no tiene permiso para esta operación (rol incorrecto o recurso ajeno).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: PROHIBIDO
            mensaje: No tienes permiso para realizar esta operación.
    Conflicto:
      description: La operación choca con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: CONFLICTO
            mensaje: La storyline no se puede publicar porque tiene capítulos sin escenas.
  schemas:
    Error:
      type: object
      required:
      - codigo
      - mensaje
      properties:
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
          example: Uno o más campos son inválidos.
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
    Paginacion:
      type: object
      required:
      - pagina
      - limite
      - total
      - totalPaginas
      properties:
        pagina:
          type: integer
          example: 1
        limite:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
        totalPaginas:
          type: integer
          example: 3
    Rol:
      type: string
      enum:
      - estudiante
      - docente
      - administrador
    NivelMCER:
      type: string
      description: Nivel del Marco Común Europeo de Referencia.
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      - C2
    RegistroRequest:
      type: object
      required:
      - nombre
      - correo
      - contrasena
      - rol
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Ana López
        correo:
          type: string
          format: email
          example: ana@unitec.edu
        contrasena:
          type: string
          format: password
          minLength: 8
        rol:
          type: string
          description: El rol `administrador` no se puede elegir al registrarse.
          enum:
          - estudiante
          - docente
          default: estudiante
        institucion:
          type: string
          description: Solo para docentes.
          example: UNITEC
    LoginRequest:
      type: object
      required:
      - correo
      - contrasena
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    Tokens:
      type: object
      required:
      - accessToken
      - refreshToken
      - tipo
      - expiraEn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: integer
          description: Segundos hasta que expira el token de acceso.
          example: 3600
    AuthResponse:
      type: object
      required:
      - usuario
      - tokens
      properties:
        usuario:
          $ref: '#/components/schemas/PerfilUsuario'
        tokens:
          $ref: '#/components/schemas/Tokens'
    TipoNotificacion:
      type: string
      enum:
      - racha_en_riesgo
      - asignacion_nueva
      - asignacion_por_vencer
      - capitulo_desbloqueado
      - insignia_obtenida
    Usuario:
      type: object
      description: Clase base abstracta. Nunca se devuelve sola; siempre como Estudiante, Docente o Administrador.
      required:
      - id
      - nombre
      - correo
      - rol
      - fechaRegistro
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Ana López
        correo:
          type: string
          format: email
          example: ana@unitec.edu
        rol:
          $ref: '#/components/schemas/Rol'
        avatarUrl:
          type: string
          format: uri
          nullable: true
        fechaRegistro:
          type: string
          format: date-time
    Estudiante:
      allOf:
      - $ref: '#/components/schemas/Usuario'
      - type: object
        required:
        - xp
        - nivelJugador
        - monedas
        - rachaActual
        - mejorRacha
        - escudos
        properties:
          nivelMCER:
            allOf:
            - $ref: '#/components/schemas/NivelMCER'
            nullable: true
            description: Nulo hasta completar la prueba de nivel.
          xp:
            type: integer
            minimum: 0
            example: 1250
          nivelJugador:
            type: integer
            minimum: 1
            example: 6
          monedas:
            type: integer
            minimum: 0
            example: 180
          rachaActual:
            type: integer
            minimum: 0
            example: 4
          mejorRacha:
            type: integer
            minimum: 0
            example: 12
          ultimoDiaActivo:
            type: string
            format: date
            nullable: true
          escudos:
            type: integer
            minimum: 0
            description: Escudos de racha disponibles.
            example: 1
    Docente:
      allOf:
      - $ref: '#/components/schemas/Usuario'
      - type: object
        properties:
          institucion:
            type: string
            nullable: true
            example: UNITEC
    Administrador:
      allOf:
      - $ref: '#/components/schemas/Usuario'
    PerfilUsuario:
      description: Perfil según el rol del usuario.
      oneOf:
      - $ref: '#/components/schemas/Estudiante'
      - $ref: '#/components/schemas/Docente'
      - $ref: '#/components/schemas/Administrador'
      discriminator:
        propertyName: rol
        mapping:
          estudiante: '#/components/schemas/Estudiante'
          docente: '#/components/schemas/Docente'
          administrador: '#/components/schemas/Administrador'
    ActualizarPerfilRequest:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
          nullable: true
        institucion:
          type: string
          description: Solo para docentes.
    Notificacion:
      type: object
      required:
      - id
      - tipo
      - titulo
      - leida
      - creadaEn
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        titulo:
          type: string
          example: Tu racha está en riesgo
        mensaje:
          type: string
          example: Completa una actividad hoy para no perder tu racha de 4 días.
        datos:
          type: object
          description: Referencias al recurso relacionado (por ejemplo, el capítulo o la asignación).
          additionalProperties: true
          example:
            capituloId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        leida:
          type: boolean
          example: false
        creadaEn:
          type: string
          format: date-time
    ListaNotificaciones:
      type: object
      required:
      - datos
      - noLeidas
      - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        noLeidas:
          type: integer
          example: 3
        paginacion:
          $ref: '#/components/schemas/Paginacion'
    ActualizarNotificacionRequest:
      type: object
      required:
      - leida
      properties:
        leida:
          type: boolean
    RecuperarContrasenaRequest:
      type: object
      required:
      - correo
      properties:
        correo:
          type: string
          format: email
    RestablecerContrasenaRequest:
      type: object
      required:
      - token
      - nuevaContrasena
      properties:
        token:
          type: string
          description: Token de un solo uso que llegó en el enlace del correo.
        nuevaContrasena:
          type: string
          format: password
          minLength: 8
    CambiarContrasenaRequest:
      type: object
      required:
      - contrasenaActual
      - nuevaContrasena
      properties:
        contrasenaActual:
          type: string
          format: password
        nuevaContrasena:
          type: string
          format: password
          minLength: 8
          description: Debe ser distinta de la actual.
    RecordatorioDiario:
      type: object
      required:
      - activo
      properties:
        activo:
          type: boolean
        hora:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora local del recordatorio, en formato HH:mm.
    PreferenciasNotificacion:
      type: object
      description: Preferencias de notificación del usuario.
      required:
      - recordatorioDiario
      - tiposDesactivados
      properties:
        recordatorioDiario:
          $ref: '#/components/schemas/RecordatorioDiario'
        zonaHoraria:
          type: string
          description: Zona horaria IANA para enviar el recordatorio a la hora local.
        tiposDesactivados:
          type: array
          description: Tipos de notificación que el usuario no quiere recibir.
          items:
            $ref: '#/components/schemas/TipoNotificacion'
    ActualizarPreferenciasRequest:
      type: object
      minProperties: 1
      properties:
        recordatorioDiario:
          $ref: '#/components/schemas/RecordatorioDiario'
        zonaHoraria:
          type: string
        tiposDesactivados:
          type: array
          items:
            $ref: '#/components/schemas/TipoNotificacion'
    RegistrarDispositivoRequest:
      type: object
      required:
      - token
      - plataforma
      properties:
        token:
          type: string
          description: Token de notificaciones push del dispositivo (por ejemplo, de Firebase).
        plataforma:
          type: string
          enum:
          - android
          - ios
          - web
    EstadoCapitulo:
      type: string
      enum:
      - bloqueado
      - disponible
      - en_curso
      - completado
    ProgresoCapitulo:
      type: object
      description: Une un Estudiante con un Capitulo.
      required:
      - estudianteId
      - capituloId
      - estado
      properties:
        estudianteId:
          type: string
          format: uuid
        capituloId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoCapitulo'
        escenaActual:
          type: integer
          minimum: 1
          nullable: true
          description: '`orden` de la escena donde retomar. Nulo si nunca se inició.'
          example: 3
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Mejor % de aciertos en primeros intentos. Nulo si nunca se finalizó.
        estrellas:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
          description: Mejores estrellas obtenidas. Nulo si aún no se aprueba.
        completadoEn:
          type: string
          format: date-time
          nullable: true
          description: Primera vez que se aprobó.
    IntentoActividad:
      type: object
      description: Une un Estudiante con una Actividad.
      required:
      - id
      - estudianteId
      - actividadId
      - respuesta
      - esCorrecta
      - usoPista
      - numeroIntento
      - fecha
      properties:
        id:
          type: string
          format: uuid
        estudianteId:
          type: string
          format: uuid
        actividadId:
          type: string
          format: uuid
        respuesta:
          $ref: '#/components/schemas/Respuesta'
        esCorrecta:
          type: boolean
        usoPista:
          type: boolean
        numeroIntento:
          type: integer
          minimum: 1
          description: Se reinicia cada vez que el estudiante inicia o repite el capítulo.
          example: 1
        fecha:
          type: string
          format: date-time
    Insignia:
      type: object
      required:
      - id
      - nombre
      - descripcion
      - criterio
      - iconoUrl
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Constancia
        descripcion:
          type: string
          example: Practica 7 días seguidos.
        criterio:
          type: string
          description: Código de la regla que la otorga.
          example: RACHA_7_DIAS
        iconoUrl:
          type: string
          format: uri
    LogroObtenido:
      type: object
      description: Une un Estudiante con una Insignia.
      required:
      - estudianteId
      - insignia
      - fechaObtencion
      properties:
        estudianteId:
          type: string
          format: uuid
        insignia:
          $ref: '#/components/schemas/Insignia'
        fechaObtencion:
          type: string
          format: date-time
    ListaLogros:
      type: object
      required:
      - datos
      - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/LogroObtenido'
        paginacion:
          $ref: '#/components/schemas/Paginacion'
    TipoActividad:
      type: string
      enum:
      - vocabulario
      - comprension
      - escucha
      - escritura
      - pronunciacion
    CapituloJuego:
      type: object
      required:
      - id
      - storylineId
      - numero
      - titulo
      - puntajeMinimo
      - escenas
      - progreso
      properties:
        id:
          type: string
          format: uuid
        storylineId:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
          example: 2
        titulo:
          type: string
          example: La estación de tren
        puntajeMinimo:
          type: integer
          minimum: 0
          maximum: 100
          example: 60
        escenas:
          type: array
          items:
            $ref: '#/components/schemas/EscenaJuego'
        progreso:
          $ref: '#/components/schemas/ProgresoCapitulo'
    EscenaJuego:
      type: object
      required:
      - id
      - orden
      - tipo
      - texto
      - actividades
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
          minimum: 1
        tipo:
          type: string
          enum:
          - narracion
          - dialogo
        texto:
          type: string
        personajeId:
          type: string
          format: uuid
          nullable: true
          description: Quién habla, en escenas de diálogo.
        imagenUrl:
          type: string
          format: uri
          nullable: true
        audioUrl:
          type: string
          format: uri
          nullable: true
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadJuego'
    ActividadJuego:
      type: object
      description: Actividad tal como la ve el estudiante, sin respuestaCorrecta, explicacion ni pista.
      required:
      - id
      - tipo
      - enunciado
      - costoPista
      - xp
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoActividad'
        enunciado:
          type: string
          example: ¿Qué significa "apple"?
        opciones:
          type: array
          nullable: true
          description: Opciones para elegir, emparejar u ordenar. Nulo si la respuesta es texto libre
            o audio.
          items:
            type: object
            required:
            - clave
            - texto
            properties:
              clave:
                type: string
                example: b
              texto:
                type: string
                example: manzana
        audioUrl:
          type: string
          format: uri
          nullable: true
          description: Audio a escuchar (actividades de escucha).
        costoPista:
          type: integer
          minimum: 0
          example: 5
        xp:
          type: integer
          minimum: 0
          example: 10
    Respuesta:
      description: 'Texto o clave de opción (`string`) para elegir, escuchar o escribir;

        lista ordenada (`array`) para emparejar u ordenar.

        '
      oneOf:
      - type: string
        maxLength: 500
      - type: array
        minItems: 1
        items:
          type: string
    NuevoIntento:
      type: object
      required:
      - respuesta
      properties:
        respuesta:
          $ref: '#/components/schemas/Respuesta'
    EstadoEstudiante:
      type: object
      description: Saldo de gamificación del estudiante después de la operación.
      required:
      - xp
      - nivelJugador
      - monedas
      - rachaActual
      - mejorRacha
      - escudos
      properties:
        xp:
          type: integer
          minimum: 0
          example: 1260
        nivelJugador:
          type: integer
          minimum: 1
          example: 6
        monedas:
          type: integer
          minimum: 0
          example: 175
        rachaActual:
          type: integer
          minimum: 0
          example: 5
        mejorRacha:
          type: integer
          minimum: 0
          example: 12
        escudos:
          type: integer
          minimum: 0
          example: 1
    ResultadoIntento:
      type: object
      required:
      - intento
      - respuestaCorrecta
      - explicacion
      - cuentaParaPuntaje
      - xpGanada
      - estudiante
      - escenaActual
      properties:
        intento:
          $ref: '#/components/schemas/IntentoActividad'
        respuestaCorrecta:
          $ref: '#/components/schemas/Respuesta'
        explicacion:
          type: string
          example: '"Apple" significa "manzana".'
        cuentaParaPuntaje:
          type: boolean
          description: Verdadero solo si es el primer intento.
        xpGanada:
          type: integer
          minimum: 0
          description: XP de la actividad; solo si `cuentaParaPuntaje` y `esCorrecta`.
          example: 10
        estudiante:
          $ref: '#/components/schemas/EstadoEstudiante'
        escenaActual:
          type: integer
          description: Escena guardada en el progreso tras este intento.
          example: 3
    PistaEntregada:
      type: object
      required:
      - actividadId
      - pista
      - costo
      - monedasRestantes
      - yaPedida
      properties:
        actividadId:
          type: string
          format: uuid
        pista:
          type: string
          example: Es una fruta roja o verde.
        costo:
          type: integer
          minimum: 0
          description: Monedas cobradas en esta llamada (0 si ya se había pedido).
          example: 5
        monedasRestantes:
          type: integer
          minimum: 0
          example: 170
        yaPedida:
          type: boolean
    ResultadoFinalizacion:
      type: object
      required:
      - progreso
      - aprobado
      - puntaje
      - recompensas
      - nivelJugador
      - estudiante
      - siguienteCapitulo
      - insigniasNuevas
      properties:
        progreso:
          $ref: '#/components/schemas/ProgresoCapitulo'
        aprobado:
          type: boolean
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          description: Puntaje de esta partida (el progreso guarda el mejor).
          example: 85
        estrellas:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
          description: Estrellas de esta partida; nulo si no aprobó.
          example: 2
        recompensas:
          type: object
          required:
          - xp
          - monedas
          properties:
            xp:
              type: integer
              minimum: 0
              example: 50
            monedas:
              type: integer
              minimum: 0
              example: 15
        nivelJugador:
          type: object
          required:
          - anterior
          - actual
          - subioNivel
          properties:
            anterior:
              type: integer
              example: 6
            actual:
              type: integer
              example: 7
            subioNivel:
              type: boolean
        estudiante:
          $ref: '#/components/schemas/EstadoEstudiante'
        siguienteCapitulo:
          type: object
          nullable: true
          description: Nulo si era el último capítulo de la storyline.
          required:
          - capituloId
          - estado
          properties:
            capituloId:
              type: string
              format: uuid
            estado:
              $ref: '#/components/schemas/EstadoCapitulo'
        insigniasNuevas:
          type: array
          items:
            $ref: '#/components/schemas/LogroObtenido'
    NuevoIntentoPronunciacion:
      type: object
      required:
      - audio
      properties:
        audio:
          type: string
          format: binary
          description: Grabación del estudiante.
    TipoEscena:
      type: string
      enum:
      - narracion
      - dialogo
    EstadoPruebaNivel:
      type: string
      enum:
      - en_curso
      - completada
    Opcion:
      type: object
      description: Opción de una actividad. El estudiante responde con la `clave`.
      required:
      - clave
      - texto
      properties:
        clave:
          type: string
          example: a
        texto:
          type: string
          example: fecha límite
    Personaje:
      type: object
      required:
      - nombre
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          description: Único dentro de su storyline; las escenas lo usan para referirse al personaje.
          maxLength: 60
          example: Maya
        descripcion:
          type: string
          example: Tu mentora, ingeniera de software senior.
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.linguarena.app/avatares/maya.png
    Actividad:
      type: object
      description: 'Ejercicio ligado a una escena. `respuestaCorrecta`, `explicacion` y

        `pista` son solo de entrada: nunca se devuelven aquí. El estudiante recibe

        la explicación al responder y la pista al pedirla pagando monedas

        (RF-15, RF-16).

        '
      required:
      - tipo
      - enunciado
      - respuestaCorrecta
      - xp
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tipo:
          $ref: '#/components/schemas/TipoActividad'
        enunciado:
          type: string
          example: What does 'deadline' mean?
        audioUrl:
          type: string
          format: uri
          nullable: true
          description: Audio a escuchar (actividades de escucha).
        opciones:
          type: array
          nullable: true
          description: Opciones para elegir, emparejar u ordenar. Nulo en las de texto libre o audio.
          items:
            $ref: '#/components/schemas/Opcion'
        respuestaCorrecta:
          writeOnly: true
          description: Clave de la opción correcta, texto esperado o lista ordenada (ver `Respuesta`).
          allOf:
          - $ref: '#/components/schemas/Respuesta'
        explicacion:
          type: string
          writeOnly: true
          example: '''Deadline'' es la fecha o la hora máxima para entregar algo.'
        pista:
          type: string
          writeOnly: true
          example: Piensa en la palabra "plazo".
        costoPista:
          type: integer
          minimum: 0
          description: Monedas que cuesta la pista (RN-04).
          example: 5
        xp:
          type: integer
          minimum: 0
          description: XP que otorga al responder correctamente.
          example: 10
    Escena:
      type: object
      description: Momento de un capítulo, de narración o de diálogo, con actividades intercaladas.
      required:
      - orden
      - tipo
      - texto
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orden:
          type: integer
          minimum: 1
          description: Posición de la escena dentro del capítulo.
          example: 2
        tipo:
          $ref: '#/components/schemas/TipoEscena'
        texto:
          type: string
          example: 'Maya: Hi! I''m Maya. Your first deadline is on Friday.'
        imagenUrl:
          type: string
          format: uri
          nullable: true
        audioUrl:
          type: string
          format: uri
          nullable: true
        personaje:
          type: string
          nullable: true
          description: 'Nombre del personaje que habla en las escenas de diálogo; debe existir

            en `personajes` de la storyline. Al jugar el capítulo se devuelve como

            `personajeId`.

            '
          example: Maya
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/Actividad'
    Capitulo:
      type: object
      description: 'Parte de la historia que se juega en una sesión corta. En el catálogo y

        en la vista de la storyline solo trae el resumen; `escenas` se usa al

        cargar el contenido y se lee con `GET /capitulos/{capituloId}`.

        '
      required:
      - numero
      - titulo
      - puntajeMinimo
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        numero:
          type: integer
          minimum: 1
          description: Orden del capítulo dentro de la storyline.
          example: 1
        titulo:
          type: string
          example: Welcome to the team
        puntajeMinimo:
          type: integer
          minimum: 0
          maximum: 100
          default: 60
          description: Porcentaje de aciertos necesario para aprobar el capítulo (RN-01).
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoCapitulo'
          readOnly: true
          description: Estado del estudiante que consulta.
        estrellas:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
          readOnly: true
          description: Estrellas obtenidas por el estudiante. Nulo si aún no lo completa.
        escenas:
          type: array
          minItems: 1
          writeOnly: true
          items:
            $ref: '#/components/schemas/Escena'
    StorylineResumen:
      type: object
      required:
      - id
      - titulo
      - tema
      - nivelMCER
      - totalCapitulos
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        titulo:
          type: string
          example: Tu primer día como ingeniero
        tema:
          type: string
          example: Ingeniería
        nivelMCER:
          $ref: '#/components/schemas/NivelMCER'
        descripcion:
          type: string
        portadaUrl:
          type: string
          format: uri
          nullable: true
        publicada:
          type: boolean
          default: false
          description: Solo las storylines publicadas aparecen en el catálogo (RN-09).
        totalCapitulos:
          type: integer
          readOnly: true
          example: 8
        recomendada:
          type: boolean
          readOnly: true
          description: Verdadero si coincide con el nivel del estudiante (RN-06).
    Storyline:
      description: Historia completa con sus personajes y capítulos.
      allOf:
      - $ref: '#/components/schemas/StorylineResumen'
      - type: object
        required:
        - personajes
        - capitulos
        properties:
          personajes:
            type: array
            items:
              $ref: '#/components/schemas/Personaje'
          capitulos:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/Capitulo'
    ListaStorylines:
      type: object
      required:
      - datos
      - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/StorylineResumen'
        paginacion:
          $ref: '#/components/schemas/Paginacion'
    ActualizarStorylineRequest:
      type: object
      minProperties: 1
      properties:
        titulo:
          type: string
        tema:
          type: string
        nivelMCER:
          $ref: '#/components/schemas/NivelMCER'
        descripcion:
          type: string
        portadaUrl:
          type: string
          format: uri
          nullable: true
        publicada:
          type: boolean
          description: Verdadero para publicar, falso para sacarla del catálogo.
    PreguntaNivel:
      type: object
      description: Pregunta de la prueba de nivel. Nunca incluye la respuesta correcta.
      required:
      - id
      - tipo
      - enunciado
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoActividad'
        enunciado:
          type: string
          example: Choose the sentence that is correct.
        contexto:
          type: string
          nullable: true
          description: Texto a leer en las preguntas de comprensión.
        audioUrl:
          type: string
          format: uri
          nullable: true
          description: Audio a escuchar en las preguntas de escucha.
        opciones:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Opcion'
    PruebaNivel:
      type: object
      required:
      - id
      - fecha
      - estado
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
        estado:
          $ref: '#/components/schemas/EstadoPruebaNivel'
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          readOnly: true
          description: Porcentaje de aciertos. Nulo mientras la prueba está en curso.
          example: 72
        nivelAsignado:
          allOf:
          - $ref: '#/components/schemas/NivelMCER'
          nullable: true
          readOnly: true
          description: Nivel A1–C2 asignado. Nulo mientras la prueba está en curso.
        preguntas:
          type: array
          readOnly: true
          description: Solo se incluyen mientras la prueba está en curso.
          items:
            $ref: '#/components/schemas/PreguntaNivel'
        storylinesRecomendadas:
          type: array
          readOnly: true
          description: Storylines publicadas del nivel asignado. Solo con la prueba completada (RN-06).
          items:
            $ref: '#/components/schemas/StorylineResumen'
    RespuestasPruebaNivelRequest:
      type: object
      required:
      - respuestas
      properties:
        respuestas:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - preguntaId
            - respuesta
            properties:
              preguntaId:
                type: string
                format: uuid
              respuesta:
                $ref: '#/components/schemas/Respuesta'
    CrearGrupoRequest:
      type: object
      required:
      - nombre
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Inglés Técnico
        seccion:
          type: string
          maxLength: 40
          example: Sección 1101
    UnirseGrupoRequest:
      type: object
      required:
      - codigoInvitacion
      properties:
        codigoInvitacion:
          type: string
          example: K7QM2X
    CrearAsignacionRequest:
      type: object
      required:
      - capituloId
      - fechaLimite
      properties:
        capituloId:
          type: string
          format: uuid
        fechaLimite:
          type: string
          format: date-time
          description: Debe ser posterior al momento de la petición.
          example: '2026-12-05T23:59:00-06:00'
    Grupo:
      type: object
      description: Sección de clase de un docente (RN-07).
      required:
      - id
      - nombre
      - docenteId
      - totalEstudiantes
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          example: Inglés Técnico
        seccion:
          type: string
          nullable: true
          example: Sección 1101
        codigoInvitacion:
          type: string
          readOnly: true
          description: Solo lo ve el docente dueño del grupo; para los estudiantes se omite.
          example: K7QM2X
        docenteId:
          type: string
          format: uuid
          readOnly: true
        totalEstudiantes:
          type: integer
          minimum: 0
          readOnly: true
          example: 28
    ListaGrupos:
      type: object
      required:
      - datos
      - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Grupo'
        paginacion:
          $ref: '#/components/schemas/Paginacion'
    Asignacion:
      type: object
      description: Une un Grupo con un Capitulo, con una fecha límite.
      required:
      - id
      - grupoId
      - capituloId
      - fechaLimite
      - fechaCreacion
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grupoId:
          type: string
          format: uuid
          readOnly: true
        capituloId:
          type: string
          format: uuid
        fechaLimite:
          type: string
          format: date-time
        fechaCreacion:
          type: string
          format: date-time
          readOnly: true
        capitulo:
          type: object
          readOnly: true
          description: Resumen del capítulo asignado.
          required:
          - storylineId
          - storylineTitulo
          - numero
          - titulo
          properties:
            storylineId:
              type: string
              format: uuid
            storylineTitulo:
              type: string
              example: Tu primer día como ingeniero
            numero:
              type: integer
              minimum: 1
              example: 2
            titulo:
              type: string
              example: La estación de tren
    ListaAsignaciones:
      type: object
      required:
      - datos
      - paginacion
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Asignacion'
        paginacion:
          $ref: '#/components/schemas/Paginacion'
    AvanceAsignacion:
      type: object
      description: Avance de un estudiante en una asignación (sale de su ProgresoCapitulo).
      required:
      - asignacionId
      - capituloId
      - titulo
      - fechaLimite
      - estado
      properties:
        asignacionId:
          type: string
          format: uuid
        capituloId:
          type: string
          format: uuid
        titulo:
          type: string
          example: La estación de tren
        fechaLimite:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoCapitulo'
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Mejor puntaje del estudiante. Nulo si nunca lo finalizó.
        estrellas:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
        completadoEn:
          type: string
          format: date-time
          nullable: true
          description: Primera vez que se aprobó.
        aTiempo:
          type: boolean
          nullable: true
          description: Verdadero si lo aprobó antes de la fecha límite. Nulo si aún no lo aprueba.
    ProgresoEstudianteGrupo:
      type: object
      description: Avance de un estudiante en las asignaciones de un grupo.
      required:
      - estudianteId
      - nombre
      - nivelJugador
      - rachaActual
      - capitulosCompletados
      - asignaciones
      properties:
        estudianteId:
          type: string
          format: uuid
        nombre:
          type: string
          example: Ana López
        nivelMCER:
          allOf:
          - $ref: '#/components/schemas/NivelMCER'
          nullable: true
        nivelJugador:
          type: integer
          minimum: 1
          example: 6
        rachaActual:
          type: integer
          minimum: 0
          example: 4
        ultimoDiaActivo:
          type: string
          format: date
          nullable: true
        capitulosCompletados:
          type: integer
          minimum: 0
          description: Capítulos aprobados en total, no solo los asignados.
          example: 9
        asignaciones:
          type: array
          items:
            $ref: '#/components/schemas/AvanceAsignacion'
    ProgresoGrupo:
      type: object
      description: Progreso del grupo para el docente (RF-28).
      required:
      - grupoId
      - totalEstudiantes
      - asignaciones
      - estudiantes
      - paginacion
      properties:
        grupoId:
          type: string
          format: uuid
        totalEstudiantes:
          type: integer
          minimum: 0
          example: 28
        asignaciones:
          type: array
          description: Resumen del grupo por cada asignación.
          items:
            type: object
            required:
            - asignacionId
            - capituloId
            - titulo
            - fechaLimite
            - completaron
            - enCurso
            - sinIniciar
            - porcentajeCompletado
            properties:
              asignacionId:
                type: string
                format: uuid
              capituloId:
                type: string
                format: uuid
              titulo:
                type: string
                example: La estación de tren
              fechaLimite:
                type: string
                format: date-time
              completaron:
                type: integer
                minimum: 0
                example: 18
              enCurso:
                type: integer
                minimum: 0
                example: 6
              sinIniciar:
                type: integer
                minimum: 0
                example: 4
              porcentajeCompletado:
                type: integer
                minimum: 0
                maximum: 100
                example: 64
              puntajePromedio:
                type: number
                nullable: true
                description: Promedio del mejor puntaje de quienes la completaron. Nulo si nadie la completó.
                example: 78.5
        estudiantes:
          type: array
          items:
            $ref: '#/components/schemas/ProgresoEstudianteGrupo'
        paginacion:
          $ref: '#/components/schemas/Paginacion'