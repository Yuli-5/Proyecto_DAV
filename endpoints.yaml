
openapi: 3.0.3
info:
  title: LinguArena API
  version: 2.0.0
  description: |
    API RESTful de **LinguArena**, app web y móvil para aprender un idioma avanzando
    en una historia por capítulos. No hay competencia entre usuarios: el estudiante
    progresa con XP, niveles, racha, insignias y desbloqueo de capítulos.
  contact:
    name: Equipo 2
  tags:
    - name: Cuenta
      description: Registro, inicio de sesión, perfil y notificaciones.
    - name: Capitulos
      description: Actividades, pistas, recompensas, insignias, progreso y cierre de capitulos.

paths:
  /auth/registro:
    post:
      tags: [Cuenta]
      summary: Registrarse
      description: Crea la cuenta e inicia sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Usuario creado y sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags: [Cuenta]
      summary: Iniciar sesión
      description: Valida las credenciales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/refresh:
    post:
      tags: [Cuenta]
      summary: Renovar el token de acceso
      description: Entrega un token de acceso nuevo a partir del token de renovación. (RF-02)
      operationId: renovarToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nuevos tokens emitidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auth/logout:
    post:
      tags: [Cuenta]
      summary: Cerrar sesión
      description: Invalida el token de renovación del dispositivo actual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada.

  /usuarios/me:
    get:
      tags: [Cuenta]
      summary: Ver mi perfil
      description: |
        Devuelve el perfil del usuario autenticado. 
      operationId: obtenerMiPerfil
      responses:
        '200':
          description: Perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUsuario'

    patch:
      tags: [Cuenta]
      summary: Editar mi perfil
      description: Actualiza los campos enviados. 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUsuario'

  /notificaciones:
    get:
      tags: [Cuenta]
      summary: Ver mis notificaciones
      description: Lista las notificaciones del usuario en orden .
      parameters:
        - name: leida
          in: query
          required: false
          description: Filtra por leídas o no leídas. Omitir = todas
          schema:
            type: boolean
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Notificaciones del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaNotificaciones'
  /notificaciones/{notificacionId}:
    patch:
      tags: [Cuenta]
      summary: Marcar una notificación como leída o no leída
      description: Solo el dueño de la notificación puede cambiarla.
      parameters:
        - $ref: '#/components/parameters/NotificacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarNotificacionRequest'
      responses:
        '200':
          description: Notificación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /usuarios/me/insignias:
    get:
      tags: [Capitulos]
      summary: Ver mis insignias
      description: Lista las insignias que obtuvo el usuario, de la más reciente a la más antigua.
      operationId: listarMisInsignias
      parameters:
        -$ref: '#components/parameters/Pagina'
        -$ref: '#components/parameters/Limite'
      responses:
        '200':
        description: Insignias obtenidas.
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/ListaLogros'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
  /capitulos/{capituloId}:
    get:
      tags: [Capitulos]
      summary: Obtener escenas y actividades de un capítulo
      description: Devuelve el capítulo con sus escenas en orden y las actividades. 
                  Incluye el progreso del estudiante para saber qué escena retomar.
      operationId: obtenerCapitulo
      parameters:
        - $ref: '#/components/parameters/CapituloId'
      responses:
        '200':
          description: Capítulo listo para jugar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapituloJuego'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /capitulos/{capituloId}/inicio:
    post:
      tags: [Capitulos]
      summary: Empezar o retomar un capítulo
      description: |
      - Si el capitulo está disponible o completado y se quiere repetir lo pasa a un estado
        `en curso`. Si el curso esta en un estado `en curso`, no cambia nada y devuelve el progreso actual.
      operationId: iniciarCapitulo
      parameters:
        - $ref: '#/components/parameters/CapituloId'
      responses:
        '200':
          description: Capítulo retomado en la escena donde se quedó.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresoCapitulo'
        '201':
          description: Capítulo iniciado (o reiniciado para repetirlo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgresoCapitulo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /capitulo/{capituloId}/finalizacion:
    post:
      tags: [Capitulos]
      summary: Da por finalizado el capitulo (puntaje, estrellas, recompensas y desbloquea el siguiente capitulo)
      description:
        Calcula el puntaje y lo compara con el `puntajeMinimo`. Lo da por **Aprobado** o **No Aprobado**
      operationId: finalizarCapitulo
      parameters:
        - $ref: '#/components/parameters/CapituloId'
      responses:
        '200':
          description: Capítulo cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoFinalizacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El capítulo no está en curso o faltan actividades por responder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                incompleto:
                  value:
                    codigo: CAPITULO_INCOMPLETO
                    mensaje: Faltan 2 actividades por responder.
                noIniciado:
                  value:
                    codigo: CAPITULO_NO_INICIADO
                    mensaje: Este capítulo no está en curso.


/actividades/{actividadId}/intentos:
    post:
      tags: [Capitulos]
      summary: Responder una actividad y recibir corrección y XP
      description:
        Registra un `IntentoActividad`, lo corrige al instante y devuelve la
        respuesta correcta y la explicación.
      operationId: responderActividad
      parameters:
        - $ref: '#/components/parameters/ActividadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoIntento'
            examples:
              opcionUnica:
                summary: Vocabulario / comprensión / escucha
                value:
                  respuesta: b
              textoLibre:
                summary: Escucha (escribir) / escritura corta
                value:
                  respuesta: I would like a coffee
              emparejar:
                summary: Emparejar u ordenar
                value:
                  respuesta: [apple-manzana, dog-perro, house-casa]
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NuevoIntentoPronunciacion'
      responses:
        '201':
          description: Intento registrado y corregido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoIntento'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El capítulo de esta actividad no está `en_curso`; hay que llamar a `/inicio` primero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: CAPITULO_NO_INICIADO
                mensaje: Inicia el capítulo antes de responder sus actividades.
        '502':
          description: El Servicio de voz no respondió (solo pronunciación).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: SERVICIO_VOZ_NO_DISPONIBLE
                mensaje: No pudimos calificar tu pronunciación. Intenta de nuevo.

/actividades/{actividadId}/pista:
    post:
      tags: [Capitulos]
      summary: Pedir una pista (descuenta monedas)
      description:
        Descuenta `costoPista` monedas y devuelve la pista.
      operationId: pedirPista
      parameters:
        - $ref: '#/components/parameters/ActividadId'
      responses:
        '200':
          description: Pista entregada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PistaEntregada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CapituloBloqueado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Saldo insuficiente o capítulo no iniciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saldo:
                  value:
                    codigo: SALDO_INSUFICIENTE
                    mensaje: No tienes monedas suficientes para esta pista.
                    detalles:
                      - campo: monedas
                        mensaje: Tienes 2 monedas y la pista cuesta 5.
                noIniciado:
                  value:
                    codigo: CAPITULO_NO_INICIADO
                    mensaje: Inicia el capítulo antes de pedir pistas.

components:
  parameters: 
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limite:
      name: limite
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    NotificacionId:
      name: notificacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapituloId:
      name: capituloId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActividadId:
      name: actividadId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: Recurso no encontrado.
    SolicitudInvalida:
      description: El cuerpo o los parámetros no tienen el formato esperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: VALIDACION
            mensaje: Uno o más campos son inválidos.
            detalles:
              - campo: respuesta
                mensaje: Es obligatorio.
    NoAutenticado:
      description: Falta el token, es inválido o expiró.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_AUTENTICADO
            mensaje: Token ausente o expirado.
    RolNoPermitido:
      description: El rol del usuario no puede usar este recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ROL_NO_PERMITIDO
            mensaje: Solo los estudiantes pueden usar este recurso.
    CapituloBloqueado:
      description: El capítulo sigue bloqueado (RN-01) o el rol no es estudiante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bloqueado:
              value:
                codigo: CAPITULO_BLOQUEADO
                mensaje: Aprueba el capítulo anterior para desbloquear este.
            rol:
              value:
                codigo: ROL_NO_PERMITIDO
                mensaje: Solo los estudiantes pueden jugar capítulos.
  schemas:

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
          example: Uno o más campos son inválidos.
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string

    Paginacion:
      type: object
      required: [pagina, limite, total, totalPaginas]
      properties:
        pagina:
          type: integer
          example: 1
        limite:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
        totalPaginas:
          type: integer
          example: 3

    Rol:
      type: string
      enum: [estudiante, docente, administrador]

    NivelMCER:
      type: string
      description: Nivel del Marco Común Europeo de Referencia.
      enum: [A1, A2, B1, B2, C1, C2]     

    RegistroRequest:
      type: object
      required: [nombre, correo, contrasena, rol]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
          example: Ana López
        correo:
          type: string
          format: email
          example: ana@unitec.edu
        contrasena:
          type: string
          format: password
          minLength: 8
        rol:
          type: string
          description: El rol `administrador` no se puede elegir al registrarse.
          enum: [estudiante, docente]
          default: estudiante
        institucion:
          type: string
          description: Solo para docentes.
          example: UNITEC

    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    Tokens:
      type: object
      required: [accessToken, refreshToken, tipo, expiraEn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: integer
          description: Segundos hasta que expira el token de acceso.
          example: 3600

    AuthResponse:
      type: object
      required: [usuario, tokens]
      properties:
        usuario:
          $ref: '#/components/schemas/PerfilUsuario'
        tokens:
          $ref: '#/components/schemas/Tokens'

    TipoNotificacion:
      type: string
      enum:
        - racha_en_riesgo
        - asignacion_nueva
        - asignacion_por_vencer
        - capitulo_desbloqueado
        - insignia_obtenida
    Usuario:
      type: object
      description: Clase base abstracta. Nunca se devuelve sola; siempre como Estudiante, Docente o Administrador.
      required: [id, nombre, correo, rol, fechaRegistro]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Ana López
        correo:
          type: string
          format: email
          example: ana@unitec.edu
        rol:
          $ref: '#/components/schemas/Rol'
        avatarUrl:
          type: string
          format: uri
          nullable: true
        fechaRegistro:
          type: string
          format: date-time
          
    Estudiante:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          required: [xp, nivelJugador, monedas, rachaActual, mejorRacha, escudos]
          properties:
            nivelMCER:
              allOf:
                - $ref: '#/components/schemas/NivelMCER'
              nullable: true
              description: Nulo hasta completar la prueba de nivel.
            xp:
              type: integer
              minimum: 0
              example: 1250
            nivelJugador:
              type: integer
              minimum: 1
              example: 6
            monedas:
              type: integer
              minimum: 0
              example: 180
            rachaActual:
              type: integer
              minimum: 0
              example: 4
            mejorRacha:
              type: integer
              minimum: 0
              example: 12
            ultimoDiaActivo:
              type: string
              format: date
              nullable: true
            escudos:
              type: integer
              minimum: 0
              description: Escudos de racha disponibles.
              example: 1

    Docente:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            institucion:
              type: string
              nullable: true
              example: UNITEC
    Administrador:
      allOf:
        - $ref: '#/components/schemas/Usuario'
    PerfilUsuario:
      description: Perfil según el rol del usuario.
      oneOf:
        - $ref: '#/components/schemas/Estudiante'
        - $ref: '#/components/schemas/Docente'
        - $ref: '#/components/schemas/Administrador'
      discriminator:
        propertyName: rol
        mapping:
          estudiante: '#/components/schemas/Estudiante'
          docente: '#/components/schemas/Docente'
          administrador: '#/components/schemas/Administrador'
    ActualizarPerfilRequest:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
          nullable: true
        institucion:
          type: string
          description: Solo para docentes.

    Notificacion:
      type: object
      required: [id, tipo, titulo, leida, creadaEn]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        titulo:
          type: string
          example: Tu racha está en riesgo
        mensaje:
          type: string
          example: Completa una actividad hoy para no perder tu racha de 4 días.
        datos:
          type: object
          description: Referencias al recurso relacionado (por ejemplo, el capítulo o la asignación).
          additionalProperties: true
          example:
            capituloId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        leida:
          type: boolean
          example: false
        creadaEn:
          type: string
          format: date-time
    ListaNotificaciones:
      type: object
      required: [datos, noLeidas, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        noLeidas:
          type: integer
          example: 3
        paginacion:
          $ref: '#/components/schemas/Paginacion'
    ActualizarNotificacionRequest:
      type: object
      required: [leida]
      properties:
        leida:
          type: boolean

    EstadoCapitulo:
      type: string
      enum: [bloqueado, disponible, en_curso, completado]

    ProgresoCapitulo:
      type: object
      description: Une un Estudiante con un Capitulo.
      required: [estudianteId, capituloId, estado]
      properties:
        estudianteId:
          type: string
          format: uuid
        capituloId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoCapitulo'
        escenaActual:
          type: integer
          minimum: 1
          nullable: true
          description: "`orden` de la escena donde retomar. Nulo si nunca se inició."
          example: 3
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Mejor % de aciertos en primeros intentos. Nulo si nunca se finalizó.
        estrellas:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
          description: Mejores estrellas obtenidas. Nulo si aún no se aprueba.
        completadoEn:
          type: string
          format: date-time
          nullable: true
          description: Primera vez que se aprobó.

    IntentoActividad:
      type: object
      description: Une un Estudiante con una Actividad.
      required: [id, estudianteId, actividadId, respuesta, esCorrecta, usoPista, numeroIntento, fecha]
      properties:
        id:
          type: string
          format: uuid
        estudianteId:
          type: string
          format: uuid
        actividadId:
          type: string
          format: uuid
        respuesta:
          $ref: '#/components/schemas/Respuesta'
        esCorrecta:
          type: boolean
        usoPista:
          type: boolean
        numeroIntento:
          type: integer
          minimum: 1
          description: Se reinicia cada vez que el estudiante inicia o repite el capítulo.
          example: 1
        fecha:
          type: string
          format: date-time

    Insignia:
      type: object
      required: [id, nombre, descripcion, criterio, iconoUrl]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Constancia
        descripcion:
          type: string
          example: Practica 7 días seguidos.
        criterio:
          type: string
          description: Código de la regla que la otorga.
          example: RACHA_7_DIAS
        iconoUrl:
          type: string
          format: uri

    LogroObtenido:
      type: object
      description: Une un Estudiante con una Insignia.
      required: [estudianteId, insignia, fechaObtencion]
      properties:
        estudianteId:
          type: string
          format: uuid
        insignia:
          $ref: '#/components/schemas/Insignia'
        fechaObtencion:
          type: string
          format: date-time

    ListaLogros:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/LogroObtenido'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    TipoActividad:
      type: string
      enum: [vocabulario, comprension, escucha, escritura]

    CapituloJuego:
      type: object
      required: [id, storylineId, numero, titulo, puntajeMinimo, escenas, progreso]
      properties:
        id:
          type: string
          format: uuid
        storylineId:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
          example: 2
        titulo:
          type: string
          example: La estación de tren
        puntajeMinimo:
          type: integer
          minimum: 0
          maximum: 100
          example: 60
        escenas:
          type: array
          items:
            $ref: '#/components/schemas/EscenaJuego'
        progreso:
          $ref: '#/components/schemas/ProgresoCapitulo'

    EscenaJuego:
      type: object
      required: [id, orden, tipo, texto, actividades]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
          minimum: 1
        tipo:
          type: string
          enum: [narracion, dialogo]
        texto:
          type: string
        personajeId:
          type: string
          format: uuid
          nullable: true
          description: Quién habla, en escenas de diálogo.
        imagenUrl:
          type: string
          format: uri
          nullable: true
        audioUrl:
          type: string
          format: uri
          nullable: true
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadJuego'

    ActividadJuego:
      type: object
      description: Actividad tal como la ve el estudiante, sin respuestaCorrecta, explicacion ni pista.
      required: [id, tipo, enunciado, costoPista, xp]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoActividad'
        enunciado:
          type: string
          example: ¿Qué significa "apple"?
        opciones:
          type: array
          nullable: true
          description: Opciones para elegir, emparejar u ordenar. Nulo si la respuesta es texto libre o audio.
          items:
            type: object
            required: [clave, texto]
            properties:
              clave:
                type: string
                example: b
              texto:
                type: string
                example: manzana
        audioUrl:
          type: string
          format: uri
          nullable: true
          description: Audio a escuchar (actividades de escucha).
        costoPista:
          type: integer
          minimum: 0
          example: 5
        xp:
          type: integer
          minimum: 0
          example: 10

    Respuesta:
      description: |
        Texto o clave de opción (`string`) para elegir, escuchar o escribir;
        lista ordenada (`array`) para emparejar u ordenar.
      oneOf:
        - type: string
          maxLength: 500
        - type: array
          minItems: 1
          items:
            type: string

    NuevoIntento:
      type: object
      required: [respuesta]
      properties:
        respuesta:
          $ref: '#/components/schemas/Respuesta'

    EstadoEstudiante:
      type: object
      description: Saldo de gamificación del estudiante después de la operación.
      required: [xp, nivelJugador, monedas, rachaActual, mejorRacha, escudos]
      properties:
        xp:
          type: integer
          minimum: 0
          example: 1260
        nivelJugador:
          type: integer
          minimum: 1
          example: 6
        monedas:
          type: integer
          minimum: 0
          example: 175
        rachaActual:
          type: integer
          minimum: 0
          example: 5
        mejorRacha:
          type: integer
          minimum: 0
          example: 12
        escudos:
          type: integer
          minimum: 0
          example: 1

    ResultadoIntento:
      type: object
      required: [intento, respuestaCorrecta, explicacion, cuentaParaPuntaje, xpGanada, estudiante, escenaActual]
      properties:
        intento:
          $ref: '#/components/schemas/IntentoActividad'
        respuestaCorrecta:
          $ref: '#/components/schemas/Respuesta'
        explicacion:
          type: string
          example: '"Apple" significa "manzana".'
        cuentaParaPuntaje:
          type: boolean
          description: Verdadero solo si es el primer intento.
        xpGanada:
          type: integer
          minimum: 0
          description: XP de la actividad; solo si `cuentaParaPuntaje` y `esCorrecta`.
          example: 10
        estudiante:
          $ref: '#/components/schemas/EstadoEstudiante'
        escenaActual:
          type: integer
          description: Escena guardada en el progreso tras este intento.
          example: 3

    PistaEntregada:
      type: object
      required: [actividadId, pista, costo, monedasRestantes, yaPedida]
      properties:
        actividadId:
          type: string
          format: uuid
        pista:
          type: string
          example: Es una fruta roja o verde.
        costo:
          type: integer
          minimum: 0
          description: Monedas cobradas en esta llamada (0 si ya se había pedido).
          example: 5
        monedasRestantes:
          type: integer
          minimum: 0
          example: 170
        yaPedida:
          type: boolean

    ResultadoFinalizacion:
      type: object
      required: [progreso, aprobado, puntaje, recompensas, nivelJugador, estudiante, siguienteCapitulo, insigniasNuevas]
      properties:
        progreso:
          $ref: '#/components/schemas/ProgresoCapitulo'
        aprobado:
          type: boolean
        puntaje:
          type: integer
          minimum: 0
          maximum: 100
          description: Puntaje de esta partida (el progreso guarda el mejor).
          example: 85
        estrellas:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
          description: Estrellas de esta partida; nulo si no aprobó.
          example: 2
        recompensas:
          type: object
          required: [xp, monedas]
          properties:
            xp:
              type: integer
              minimum: 0
              example: 50
            monedas:
              type: integer
              minimum: 0
              example: 15
        nivelJugador:
          type: object
          required: [anterior, actual, subioNivel]
          properties:
            anterior:
              type: integer
              example: 6
            actual:
              type: integer
              example: 7
            subioNivel:
              type: boolean
        estudiante:
          $ref: '#/components/schemas/EstadoEstudiante'
        siguienteCapitulo:
          type: object
          nullable: true
          description: Nulo si era el último capítulo de la storyline.
          required: [capituloId, estado]
          properties:
            capituloId:
              type: string
              format: uuid
            estado:
              $ref: '#/components/schemas/EstadoCapitulo'
        insigniasNuevas:
          type: array
          items:
            $ref: '#/components/schemas/LogroObtenido'
 